name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: android ${{ matrix.preset }} (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        preset: [android-arm64, android-armv7, android-x86_64, android-x86]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: configure
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cmake --preset ${{ matrix.preset }}

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: install and consume
        run: ctest --test-dir out/build/${{ matrix.preset }} -R install_and_consume --output-on-failure

  interface-latest:
    name: android x86_64, against the interface's latest commit (compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: take the interface's latest commit
        run: |
          git -C extern/gdk-windowing fetch origin HEAD
          git -C extern/gdk-windowing checkout --detach FETCH_HEAD
          git -C extern/gdk-windowing submodule update --init --recursive
          git -C extern/gdk-windowing log -1 --oneline

      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: configure
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cmake --preset android-x86_64

      - name: build
        run: cmake --build --preset android-x86_64

      - name: install and consume
        run: ctest --test-dir out/build/android-x86_64 -R install_and_consume --output-on-failure

  android-emulator:
    name: android x86_64 API ${{ matrix.api-level }} (tests on an emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 34]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: let the emulator use kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: configure
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cmake --preset android-x86_64

      - name: build
        run: cmake --build --preset android-x86_64

      - name: test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          script: ctest --test-dir out/build/android-x86_64 --output-on-failure

  standards:
    name: headers standalone (${{ matrix.compiler }}, ${{ matrix.std }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        std: [c++20, c++23, c++2c]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: every header compiles alone, warnings are errors
        run: |
          for header in android_window android_context; do
            printf '#include <gdk/windowing/%s.h>\nint main(){}\n' "$header" > "${header}_alone.cpp"
            ${{ matrix.compiler }} -std=${{ matrix.std }} -Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wdeprecated -Werror \
                -Iinclude -Iextern/gdk-windowing/include -c "${header}_alone.cpp" -o /dev/null
          done

  documentation:
    name: doxygen
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: install doxygen, graphviz and ninja
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz ninja-build

      - name: generate
        run: cmake --preset linux-docs

      - name: upload for github pages
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/build/linux-docs/docs

  pages:
    name: publish to github pages
    needs: documentation
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
